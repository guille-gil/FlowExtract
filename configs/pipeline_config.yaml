# Pipeline Configuration for Decomposed Parsing

# Paths
paths:
  input_dir: "data/input"
  intermediate_dir: "data/intermediate"  # Stage-by-stage results
  output_dir: "data/output"              # Final predictions only
  annotations_dir: "data/input/annotations"
  models_dir: "data/models"

# Stage 1: Element Detection (YOLO-based)
detection:
  yolo:
    model_path: "data/models/yolo_detector.pt"
    confidence_threshold: 0.5
    iou_threshold: 0.4

# Stage 2: OCR
ocr:
  engine: "paddleocr"  # Options: "paddleocr" or "easyocr"
  language: "nl"  # Dutch
  use_gpu: true
  preserve_line_breaks: true
  confidence_threshold: 0.5

# Stage 3: Connection Derivation
arrows:
  # Line detection parameters
  line_detection:
    hough_threshold: 50        # Lower = more sensitive
    min_line_length: 20        # Minimum line length (pixels)
    max_line_gap: 15           # Maximum gap to bridge (pixels)
  
  # Connection matching parameters
  line_attachment_threshold: 15   # Distance to consider line attached to arrowhead
  target_touch_threshold: 20      # Distance for pointy end → target box
  source_trace_threshold: 30      # Distance for line endpoint → source box
  junction_detection_threshold: 15 # Distance to detect line junctions
  
  # Label assignment parameters (ja/nee on arrows)
  label_assignment:
    single_arrow_radius: 100      # Search radius for single arrows (pixels)
    branching_radius: 150         # Search radius for branching decisions (pixels)
    distance_penalty_factor: 50.0 # Normalization factor for distance penalty

# Evaluation
evaluation:
  entity_matching:
    similarity_threshold: 0.85
    normalization: true
    
  relation_matching:
    require_exact_match: true

# Pipeline Configuration for Decomposed Parsing

# Paths
paths:
  input_dir: "data/input/images/test"  # Test set images only
  intermediate_dir: "data/intermediate"  # Stage-by-stage results
  output_dir: "data/output"              # Final predictions only
  annotations_dir: "data/input/final_annotations"  # Ground truth for evaluation

# Stage 1: Element Detection (YOLO-based)
detection:
  yolo:
    model_path: "runs/detect/train/weights/best.pt"
    confidence_threshold: 0.25
    iou_threshold: 0.4

# YOLO Training Configuration
training:
  yolo:
    # Pretrained weights
    use_pretrained: true  # true = COCO pretrained, false = vanilla YOLO
    pretrained_model: "yolov8s.pt"  # COCO pretrained weights
    
    # Training parameters
    epochs: 100
    batch_size: 8
    image_size: 640
    patience: 50
    device: "mps"  # Options: "cpu", "cuda", "mps" (Apple Silicon)
    
    # Augmentation strategy (conservative for tight bounding boxes)
    augmentation:
      # Color augmentation (brightness only - simulates scan conditions)
      hsv_h: 0.0        # No hue shift
      hsv_s: 0.0        # No saturation change
      hsv_v: 0.3        # Brightness variation (±30%)
      
      # Mosaic (critical for small dataset - 4x effective size)
      mosaic: 1.0       # Always enabled
      
      # Geometric transforms (all disabled to protect tight bounding boxes)
      degrees: 0.0      # No rotation (clips corners)
      translate: 0.0    # No translation (clips boundaries)
      scale: 0.0        # No scaling (crops features)
      shear: 0.0        # No shearing
      perspective: 0.0  # No perspective transform
      flipud: 0.0       # No vertical flip (inverts text)
      fliplr: 0.0       # No horizontal flip (reverses flow + mirrors text)
      mixup: 0.0        # No mixup
      copy_paste: 0.0   # No copy-paste

# Stage 2: OCR
ocr:
  engine: "easyocr"  # Options: "paddleocr" or "easyocr"
  language: "nl"  # Dutch
  use_gpu: true
  preserve_line_breaks: true
  confidence_threshold: 0.25

# Stage 3: Connection Derivation
arrows:
  # Line detection parameters
  line_detection:
    hough_threshold: 30        # Lower = more sensitive (was 50)
    min_line_length: 15        # Minimum line length (was 20)
    max_line_gap: 25           # Maximum gap between line segments (was 15)
  
  # Connection matching parameters  
  line_attachment_threshold: 20   # Distance for line-arrow attachment (was 15)
  target_touch_threshold: 30      # Distance for arrow-box touching (was 20)
  source_trace_threshold: 40      # Distance for source tracing (was 30)
  junction_detection_threshold: 15 # Distance to detect line junctions
  
  # Label assignment parameters (ja/nee on arrows)
  label_assignment:
    single_arrow_radius: 100      # Search radius for single arrows (pixels)
    branching_radius: 150         # Search radius for branching decisions (pixels)
    distance_penalty_factor: 50.0 # Normalization factor for distance penalty
  
  # Line-based fallback for edges without arrowheads
  # Set to true to enable experimental fallback detection
  # Note: Currently reduces precision. Best results with false.
  enable_line_fallback: false

# Evaluation
evaluation:
  entity_matching:
    similarity_threshold: 0.85
    normalization: true
    
  relation_matching:
    require_exact_match: true
